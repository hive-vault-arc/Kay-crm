name: kayrealestate-antivirus
services:
  clamav:
    image: clamav/clamav@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    labels:
      com.kay.project: Kayrealestate
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - signatures:/var/lib/clamav
    mem_limit: 4g
    restart: "no"
    security_opt:
      - no-new-privileges:true
volumes:
  signatures:
