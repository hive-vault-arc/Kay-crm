name: KAY CI

on:
  push:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kay-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  repository:
    name: Repository safety
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check tracked paths, sizes, licenses and ignore rules
        run: node .github/scripts/repository-check.mjs
      - name: Scan full Git history for secrets (redacted)
        run: node .github/scripts/check-tools.mjs gitleaks
      - name: Validate workflow syntax
        run: node .github/scripts/check-tools.mjs actionlint
      - name: Test dependency-gate allowed, new, runtime and expiry paths
        run: node --test .github/scripts/dependency-policy.test.mjs
      - name: Test CI aggregate and manual integration policy
        run: node --test .github/scripts/required-check.test.mjs
      - name: Validate repository documentation without private workstation files
        shell: pwsh
        run: ./docs/03-planning/validate-sprints.ps1 -RepositoryOnly

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Reject runtime and new dependency advisories
        run: npm run security:check

  managed-runtime:
    name: Linux managed runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Create the managed-prefix interpreter (base interpreter only creates environments)
        run: python -m venv backend/.heroku/python
      - name: Install existing hash-locked runtime dependencies
        working-directory: backend
        run: ./.heroku/python/bin/python -m pip install --require-hashes -r requirements.txt
      - name: Verify real Uvicorn import, HTTP liveness, fail-closed dependency and shutdown
        run: backend/.heroku/python/bin/python .github/scripts/buildpack-smoke.py

  backend:
    name: Backend quality and unit tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Create project venv (only base-interpreter operation)
        run: python -m venv .venv
      - name: Install and check hash-locked dependencies
        run: |
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip check
      - name: Python lint, formatting and strict types
        run: ./scripts/kay.ps1 -Task check
      - name: Audit locked runtime dependencies
        run: ./.venv/Scripts/python.exe -m pip_audit -r requirements.lock --require-hashes --disable-pip
      - name: Database-independent unit tests (connections forbidden)
        run: ./.venv/Scripts/python.exe -m tests.unit_runner

  required:
    name: CI required
    if: ${{ always() }}
    needs: [repository, frontend, backend, managed-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject failed, cancelled or skipped prerequisite jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node .github/scripts/required-check.mjs
